<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Inner Glow Layer -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#ffffff" opacity="0.12"/>
  
  <!-- Rooster / Broiler Emblem -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Red/Gold Comb -->
    <circle cx="21" cy="7" r="3.5" fill="#ef4444"/>
    <circle cx="26" cy="7" r="3.5" fill="#f59e0b"/>
    <circle cx="31" cy="10" r="3" fill="#ef4444"/>

    <!-- Head & Body (White Silhouette) -->
    <path d="M22 14 C17 14, 14 18, 14 23 C14 28, 11 31, 7 33 C12 36, 16 35, 19 33 C18 36, 16 41, 12 43 C19 44, 26 40, 29 34 C31 35, 34 35, 36 33 C37 36, 36 41, 33 44 C40 43, 44 36, 42 28 C41 23, 38 18, 33 15 C30 14, 25 14, 22 14 Z" fill="#ffffff"/>

    <!-- Dark Eye -->
    <circle cx="21" cy="18" r="2" fill="#0f172a"/>
    <circle cx="21.5" cy="17.5" r="0.7" fill="#ffffff"/>

    <!-- Beak (Gold/Amber) -->
    <polygon points="15,19 8,22 15,24" fill="#fbbf24"/>

    <!-- Wattle (Red) -->
    <path d="M17 24 C15 24, 14 27, 16 29 C18 30, 20 28, 19 25 Z" fill="#ef4444"/>

    <!-- Wing Highlight -->
    <path d="M26 25 C23 28, 24 33, 29 35 C33 33, 34 29, 31 26 C29 24, 27 24, 26 25 Z" fill="#e2e8f0"/>
  </g>
  
  <!-- Crisp Emerald Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.8"/>
</svg>